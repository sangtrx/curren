services:
  api:
    build: .
    restart: unless-stopped
    ports:
      - "${CURREN_BIND_ADDRESS:-127.0.0.1}:${CURREN_HOST_PORT:-8000}:8000"
    environment:
      CURREN_DB_PATH: /data/curren.db
      CURREN_API_HOST: 0.0.0.0
      CURREN_API_PORT: 8000
      CURREN_PUBLIC_DELAY_SECONDS: ${CURREN_PUBLIC_DELAY_SECONDS:-1800}
      CURREN_MAX_CLOCK_SKEW_SECONDS: ${CURREN_MAX_CLOCK_SKEW_SECONDS:-300}
      CURREN_RATE_LIMIT_WINDOW_SECONDS: ${CURREN_RATE_LIMIT_WINDOW_SECONDS:-60}
      CURREN_PUBLIC_RATE_LIMIT: ${CURREN_PUBLIC_RATE_LIMIT:-60}
      CURREN_AUTH_RATE_LIMIT: ${CURREN_AUTH_RATE_LIMIT:-300}
      CURREN_INGEST_RATE_LIMIT: ${CURREN_INGEST_RATE_LIMIT:-120}
      CURREN_TRUSTED_PROXY_IPS: ${CURREN_TRUSTED_PROXY_IPS:-}
      CURREN_INGEST_TOKEN: ${CURREN_INGEST_TOKEN:-}
      CURREN_API_KEYS_JSON: ${CURREN_API_KEYS_JSON:-}
    volumes:
      - curren-data:/data

volumes:
  curren-data:
