[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "curren"
version = "0.4.0"
description = "Verifiable crypto trading intelligence for humans and AI agents — API, CLI, MCP and Omarchy"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Curren" }]
keywords = ["crypto", "trading-signals", "mcp", "ai-agents", "cli", "omarchy", "fastapi"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.9,<3",
  "typer>=0.12,<1",
  "uvicorn>=0.35,<1",
]

[project.urls]
Homepage = "https://curren.tech"
Repository = "https://github.com/sangtrx/curren"
Issues = "https://github.com/sangtrx/curren/issues"
Documentation = "https://github.com/sangtrx/curren/tree/main/docs"

[project.optional-dependencies]
mcp = ["mcp>=2,<3"]
dev = [
  "build>=1.2,<2",
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.9,<1",
]

[project.scripts]
curren = "curren.cli:app"
curren-api = "curren.server:main"
curren-mcp = "curren.mcp_server:main"
curren-publish = "curren.publisher:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008", "E501"]
